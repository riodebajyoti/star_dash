services:
  web:
    image: nginx:alpine
    ports:
      - "3000:80"
    command: ["nginx", "-g", "daemon off;", "-c", "/etc/nginx/nginx.conf"]
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 5s
      timeout: 3s
      retries: 10
